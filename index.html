<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- 🔥 FIREBASE COMPAT -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            width: 90%;
            max-width: 350px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }

        .login {
            background: #3b82f6;
            color: white;
        }

        .register {
            background: #22c55e;
            color: white;
        }
    </style>
</head>

<body>

    <div class="box">
        <h2>Login</h2>

        <input id="email" type="email" placeholder="Email">
        <input id="password" type="password" placeholder="Contraseña">

        <button class="login" onclick="login()">Entrar</button>
        <button class="register" onclick="register()">Registrarse</button>
    </div>

    <script>
        // 🔥 FIREBASE CONFIG (TU PROYECTO)
        const firebaseConfig = {
            apiKey: "AIzaSyCBJ1Lv13KK9MduYpGvuox_CSC08K1HtZ0",
            authDomain: "contador-8720e.firebaseapp.com",
            projectId: "contador-8720e",
            appId: "1:172651416786:web:6f9d040cde0c9a35c8310b"
        };

        // 🔥 INIT
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // 🔐 LOGIN
        async function login() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            try {
                await auth.signInWithEmailAndPassword(email, password);
                window.location.href = "contador.html";
            } catch (e) {
                alert(e.message);
            }
        }

        // 🆕 REGISTER
        async function register() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            try {
                await auth.createUserWithEmailAndPassword(email, password);
                window.location.href = "contador.html";
            } catch (e) {
                alert(e.message);
            }
        }
    </script>

</body>

</html>

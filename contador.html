<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador</title>

    <!-- 🔥 FIREBASE COMPAT -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #020617, #0f172a);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* TARJETA */
        .container {
            width: 92%;
            max-width: 380px;
            padding: 20px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        /* CONTADOR */
        .counter {
            font-size: 64px;
            font-weight: bold;
            margin: 20px 0;
            background: linear-gradient(90deg, #22c55e, #4ade80);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* TIMER */
        .timer {
            font-size: 14px;
            opacity: 0.7;
            margin-bottom: 20px;
        }

        /* BOTONES */
        button {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            transition: transform 0.1s ease, opacity 0.2s;
        }

        /* CLICK EFECTO */
        button:active {
            transform: scale(0.97);
        }

        /* COLORES */
        .resistencia {
            background: linear-gradient(135deg, #fde047, #facc15);
            color: black;
        }

        .liquido {
            background: linear-gradient(135deg, #f472b6, #ec4899);
            color: white;
        }

        .reset {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
        }

        .logout {
            background: #1e293b;
            color: white;
            margin-top: 10px;
        }

        /* HOVER */
        button:hover {
            opacity: 0.9;
        }
    </style>

</head>

<body>

    <div class="container">
        <div id="counter" class="counter">0</div>
        <div id="timer" class="timer">Tiempo: 0d 0h 0m</div>

        <button class="resistencia" onclick="resistencia()">Resistencia</button>
        <button class="liquido" onclick="liquido()">Líquido</button>
        <button class="reset" onclick="reiniciar()">Reiniciar</button>
        <button class="logout" onclick="logout()">Cerrar sesión</button>
    </div>

    <script>
        // 🔥 CONFIG FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyCBJ1Lv13KK9MduYpGvuox_CSC08K1HtZ0",
            authDomain: "contador-8720e.firebaseapp.com",
            projectId: "contador-8720e",
            appId: "1:172651416786:web:6f9d040cde0c9a35c8310b"
        };

        // 🔥 INIT
        firebase.initializeApp(firebaseConfig);

        const auth = firebase.auth();
        const db = firebase.firestore();

        let uid = null;
        let dataGlobal = null;

        // ⏱️ CONFIG 72h
        const INTERVALO = 72 * 60 * 60 * 1000;
        const INCREMENTO = 5.8;

        // 🔐 AUTH CHECK
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = "index.html";
                return;
            }

            uid = user.uid;
            await initUser();
        });

        // 📦 CREAR O CARGAR USUARIO
        async function initUser() {
            const ref = db.collection("users").doc(uid);
            const doc = await ref.get();

            if (!doc.exists) {
                await ref.set({
                    contador: 0,
                    ultimaActualizacion: Date.now(),
                    inicioUso: Date.now(),
                    reinicios: 0
                });
            }

            load();
        }

        // 🚀 CARGAR Y ACTUALIZAR
        async function load() {
            const ref = db.collection("users").doc(uid);
            const doc = await ref.get();

            let data = doc.data();

            const now = Date.now();
            const diff = now - data.ultimaActualizacion;

            const cycles = Math.floor(diff / INTERVALO);

            if (cycles > 0) {
                data.contador += cycles * INCREMENTO;
                data.ultimaActualizacion += cycles * INTERVALO;

                await ref.update({
                    contador: data.contador,
                    ultimaActualizacion: data.ultimaActualizacion
                });
            }

            dataGlobal = data;

            render();
            updateTimer();

            setInterval(updateTimer, 1000);
        }

        // 🧮 RENDER
        function render() {
            document.getElementById("counter").innerText =
                dataGlobal.contador.toFixed(2) + " €";
        }

        // ⏱️ TIMER
        function updateTimer() {
            const diff = Date.now() - dataGlobal.inicioUso;

            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const m = Math.floor((diff / (1000 * 60)) % 60);

            document.getElementById("timer").innerText =
                `Tiempo: ${d}d ${h}h ${m}m`;
        }

        // 🔘 BOTONES
        async function resistencia() {
            const ref = db.collection("users").doc(uid);
            dataGlobal.contador -= 4.5;

            await ref.update({ contador: dataGlobal.contador });
            render();
        }

        async function liquido() {
            const ref = db.collection("users").doc(uid);
            dataGlobal.contador -= 6.9;

            await ref.update({ contador: dataGlobal.contador });
            render();
        }

        async function reiniciar() {
            const ref = db.collection("users").doc(uid);

            dataGlobal.contador = 0;
            dataGlobal.inicioUso = Date.now();

            await ref.update({
                contador: 0,
                inicioUso: dataGlobal.inicioUso,
                reinicios: firebase.firestore.FieldValue.increment(1)
            });

            render();
        }

        function logout() {
            auth.signOut();
        }
    </script>

</body>

</html>

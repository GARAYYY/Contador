<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador</title>

    <!-- 🔥 FIREBASE COMPAT -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(135deg, #fcfcfc, #764ba2);
            color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 350px;
            text-align: center;
        }

        .counter {
            font-size: 64px;
            margin: 20px 0;
        }

        .timer {
            font-size: 14px;
            opacity: 0.7;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border: none;
            border-radius: 10px;
        }

        .resistencia {
            background: #facc15;
        }

        .liquido {
            background: #f472b6;
        }

        .reset {
            background: #ef4444;
        }

        .logout {
            background: #334155;
            color: white;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Has ahorrado</h2>
        <div id="counter" class="counter">0 €</div>
        <p>A lo largo de</p>
        <div id="timer" class="timer">Tiempo: 0d 0h 0m</div>

        <button class="resistencia" onclick="resistencia()">
            <img src="./imgs/electric_bolt_24dp_000000_FILL0_wght400_GRAD0_opsz24.svg" alt="Resistencia"
                style="float: left; margin-right: 8px;">
            Resistencia
        </button>
        <button class="liquido" onclick="liquido()">
            <img src="./imgs/water_drop_24dp_000000_FILL0_wght400_GRAD0_opsz24.svg" alt="Líquido"
                style="float: left; margin-right: 8px;">
            Líquido
        </button>
        <button class="reset" onclick="reiniciar()">
            <img src="./imgs/skull_24dp_000000_FILL0_wght400_GRAD0_opsz24.svg" alt="Reiniciar"
                style="float: left; margin-right: 8px;">
            Reiniciar
        </button>
        <button class="logout" onclick="logout()">
            <img src="./imgs/logout_24dp_000000_FILL0_wght400_GRAD0_opsz24.svg" alt="Cerrar sesión"
                style="float: left; margin-right: 8px;">
            Cerrar sesión
        </button>
    </div>

    <script>
        // 🔥 CONFIG FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyCBJ1Lv13KK9MduYpGvuox_CSC08K1HtZ0",
            authDomain: "contador-8720e.firebaseapp.com",
            projectId: "contador-8720e",
            appId: "1:172651416786:web:6f9d040cde0c9a35c8310b"
        };

        // 🔥 INIT
        firebase.initializeApp(firebaseConfig);

        const auth = firebase.auth();
        const db = firebase.firestore();

        let uid = null;
        let dataGlobal = null;

        // ⏱️ CONFIG 72h
        const INTERVALO = 72 * 60 * 60 * 1000;
        const INCREMENTO = 5.8;

        // 🔐 AUTH CHECK
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = "index.html";
                return;
            }

            uid = user.uid;
            await initUser();
        });

        // 📦 CREAR O CARGAR USUARIO
        async function initUser() {
            const ref = db.collection("users").doc(uid);
            const doc = await ref.get();

            if (!doc.exists) {
                await ref.set({
                    contador: 0,
                    ultimaActualizacion: Date.now(),
                    inicioUso: Date.now(),
                    reinicios: 0
                });
            }

            load();
        }

        // 🚀 CARGAR Y ACTUALIZAR
        async function load() {
            const ref = db.collection("users").doc(uid);
            const doc = await ref.get();

            let data = doc.data();

            const now = Date.now();
            const diff = now - data.ultimaActualizacion;

            const cycles = Math.floor(diff / INTERVALO);

            if (cycles > 0) {
                data.contador += cycles * INCREMENTO;
                data.ultimaActualizacion += cycles * INTERVALO;

                await ref.update({
                    contador: data.contador,
                    ultimaActualizacion: data.ultimaActualizacion
                });
            }

            dataGlobal = data;

            render();
            updateTimer();

            setInterval(updateTimer, 1000);
        }

        // 🧮 RENDER
        function render() {
            document.getElementById("counter").innerText =
                dataGlobal.contador.toFixed(2) + " €";
        }

        // ⏱️ TIMER
        function updateTimer() {
            const diff = Date.now() - dataGlobal.inicioUso;

            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const m = Math.floor((diff / (1000 * 60)) % 60);

            document.getElementById("timer").innerText =
                `Tiempo: ${d}d ${h}h ${m}m`;
        }

        // 🔘 BOTONES
        async function resistencia() {
            const ref = db.collection("users").doc(uid);
            dataGlobal.contador -= 4.5;

            await ref.update({ contador: dataGlobal.contador });
            render();
        }

        async function liquido() {
            const ref = db.collection("users").doc(uid);
            dataGlobal.contador -= 6.9;

            await ref.update({ contador: dataGlobal.contador });
            render();
        }

        async function reiniciar() {
            const ref = db.collection("users").doc(uid);

            dataGlobal.contador = 0;
            dataGlobal.inicioUso = Date.now();

            await ref.update({
                contador: 0,
                inicioUso: dataGlobal.inicioUso,
                reinicios: firebase.firestore.FieldValue.increment(1)
            });

            render();
        }

        function logout() {
            auth.signOut();
        }
    </script>

</body>

</html>

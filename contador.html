<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #020617;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 350px;
            text-align: center;
        }

        .user {
            font-size: 14px;
            margin-bottom: 10px;
            opacity: 0.7;
        }

        .counter {
            font-size: 64px;
            font-weight: bold;
            margin: 20px 0;
        }

        .timer {
            font-size: 16px;
            margin-bottom: 20px;
            opacity: 0.8;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-bottom: 10px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
        }

        /* Botones específicos */
        .resistencia {
            background: #facc15;
            color: black;
        }

        .liquido {
            background: #f472b6;
        }

        .reset {
            background: #ef4444;
        }

        .logout {
            background: #334155;
        }
    </style>

</head>

<body>

    <div class="container">
        <div class="user" id="user" style="visibility: hidden;"></div>

        <div class="counter" id="counter">0</div>
        <div class="timer" id="timer">Tiempo: 0d 0h 0m</div>

        <button class="resistencia" onclick="resistencia()">Resistencia</button>
        <button class="liquido" onclick="liquido()">Líquido</button>
        <button class="reset" onclick="reiniciar()">Reiniciar</button>
        <button class="logout" onclick="logout()">Cerrar sesión</button>

    </div>

    <script>
        // 🔐 Login check
        const usuario = localStorage.getItem("user");
        if (!usuario) window.location.href = "index.html";

        document.getElementById("user").innerText = "Usuario: " + usuario;

        // ⏱️ Config
        const INTERVALO = 72 * 60 * 60 * 1000;
        const INCREMENTO = 5.8;

        // 📦 Datos
        let contador = parseFloat(localStorage.getItem("contador")) || 0;
        let ultima = localStorage.getItem("ultimaActualizacion");

        if (!ultima) {
            ultima = Date.now();
            localStorage.setItem("ultimaActualizacion", ultima);
        } else {
            ultima = parseInt(ultima);
        }

        // 🕒 Fecha inicio (solo se crea una vez)
        let inicio = localStorage.getItem("inicioUso");
        if (!inicio) {
            inicio = Date.now();
            localStorage.setItem("inicioUso", inicio);
        } else {
            inicio = parseInt(inicio);
        }

        // 🔁 Contador de reinicios
        let reinicios = parseInt(localStorage.getItem("reinicios")) || 0;

        // 🔁 Auto incremento
        function actualizarTiempo() {
            const ahora = Date.now();
            const diferencia = ahora - ultima;

            const ciclos = Math.floor(diferencia / INTERVALO);

            if (ciclos > 0) {
                contador += ciclos * INCREMENTO;
                ultima += ciclos * INTERVALO;

                guardar();
                render();
            }
        }

        // 💾 Guardar
        function guardar() {
            localStorage.setItem("contador", contador);
            localStorage.setItem("ultimaActualizacion", ultima);
            localStorage.setItem("reinicios", reinicios);
        }

        // 🧮 Render contador
        function render() {
            document.getElementById("counter").innerText = contador.toFixed(2) + "€";
        }

        // ⏱️ Timer
        function actualizarTimer() {
            const ahora = Date.now();
            const diff = ahora - inicio;

            const dias = Math.floor(diff / (1000 * 60 * 60 * 24));
            const horas = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutos = Math.floor((diff / (1000 * 60)) % 60);

            document.getElementById("timer").innerText =
                `Tiempo: ${dias}d ${horas}h ${minutos}m`;
        }

        // 🔘 Botones
        function resistencia() {
            contador -= 4.5;
            guardar();
            render();
        }

        function liquido() {
            contador -= 6.9;
            guardar();
            render();
        }

        function reiniciar() {
            contador = 0;
            reinicios++;
            inicio = Date.now();

            localStorage.setItem("inicioUso", inicio);

            guardar();
            render();
        }

        // 🚪 Logout
        function logout() {
            localStorage.removeItem("user");
            window.location.href = "index.html";
        }

        // 🚀 INIT
        actualizarTiempo();
        render();
        actualizarTimer();

        // 🔄 Timer en vivo
        setInterval(actualizarTimer, 1000);
    </script>

</body>

</html>

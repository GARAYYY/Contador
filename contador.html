<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador</title>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #020617;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 350px;
            text-align: center;
        }

        .counter {
            font-size: 64px;
            margin: 20px 0;
        }

        .timer {
            font-size: 14px;
            opacity: 0.7;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border: none;
            border-radius: 10px;
        }

        .resistencia {
            background: #facc15;
        }

        .liquido {
            background: #f472b6;
        }

        .reset {
            background: #ef4444;
        }

        .logout {
            background: #334155;
            color: white;
        }
    </style>
</head>

<body>

    <div class="container">
        <div id="counter" class="counter">0 €</div>
        <div id="timer" class="timer">Tiempo: 0d 0h 0m</div>

        <button class="resistencia" onclick="resistencia()">Resistencia</button>
        <button class="liquido" onclick="liquido()">Líquido</button>
        <button class="reset" onclick="reiniciar()">Reiniciar</button>
        <button class="logout" onclick="logout()">Cerrar sesión</button>
    </div>

    <script>
        // 🔥 Firebase config
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "TU_PROJECT.firebaseapp.com",
            projectId: "TU_PROJECT"
        };

        firebase.initializeApp(firebaseConfig);

        const auth = firebase.auth();
        const db = firebase.firestore();

        let uid = null;
        let dataGlobal = null;

        // ⏱️ config
        const INTERVALO = 72 * 60 * 60 * 1000;
        const INCREMENTO = 5.8;

        // 🔐 auth check
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = "index.html";
                return;
            }

            uid = user.uid;

            await loadData();
        });

        // 📦 cargar datos
        async function loadData() {
            const ref = db.collection("users").doc(uid);
            const doc = await ref.get();

            if (!doc.exists) {
                await ref.set({
                    contador: 0,
                    ultimaActualizacion: Date.now(),
                    inicioUso: Date.now(),
                    reinicios: 0
                });
            }

            start();
        }

        // 🚀 loop principal
        async function start() {
            const ref = db.collection("users").doc(uid);

            const doc = await ref.get();
            let data = doc.data();

            const now = Date.now();
            const diff = now - data.ultimaActualizacion;

            const cycles = Math.floor(diff / INTERVALO);

            if (cycles > 0) {
                data.contador += cycles * INCREMENTO;
                data.ultimaActualizacion += cycles * INTERVALO;

                await ref.update({
                    contador: data.contador,
                    ultimaActualizacion: data.ultimaActualizacion
                });
            }

            dataGlobal = data;

            render();
            updateTimer();

            setInterval(updateTimer, 1000);
        }

        // 🧮 render
        function render() {
            document.getElementById("counter").innerText =
                dataGlobal.contador.toFixed(2) + " €";
        }

        // ⏱️ timer
        function updateTimer() {
            const diff = Date.now() - dataGlobal.inicioUso;

            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const m = Math.floor((diff / (1000 * 60)) % 60);

            document.getElementById("timer").innerText =
                `Tiempo: ${d}d ${h}h ${m}m`;
        }

        // 🔘 botones
        async function resistencia() {
            const ref = db.collection("users").doc(uid);
            dataGlobal.contador -= 4.5;

            await ref.update({ contador: dataGlobal.contador });
            render();
        }

        async function liquido() {
            const ref = db.collection("users").doc(uid);
            dataGlobal.contador -= 6.9;

            await ref.update({ contador: dataGlobal.contador });
            render();
        }

        async function reiniciar() {
            const ref = db.collection("users").doc(uid);

            dataGlobal.contador = 0;
            dataGlobal.inicioUso = Date.now();

            await ref.update({
                contador: 0,
                inicioUso: dataGlobal.inicioUso,
                reinicios: firebase.firestore.FieldValue.increment(1)
            });

            render();
        }

        function logout() {
            auth.signOut();
        }
    </script>

</body>

</html>
